<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TODO App</title>
</head>
<body>
    <h1>TODO List</h1>
    
    <p>ようこそ、{{ user.username }}さん！</p>
    <form action="{% url 'logout' %}" method="POST" style="display:inline;">
        {% csrf_token %}
        <button type="submit">ログアウト</button>
    </form>
    <hr>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="新しいタスクを入力" required>
        <select name="priority">
            {% for value, label in priorities %}
                <option value="{{ value }}" {% if value == 'middle' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <button type="submit">追加</button>
    </form>

    <ul>
        {% for todo in todos %}
            <li>
                <strong>[{{ todo.get_priority_display }}]</strong> {{ todo.title }}
                <form action="{% url 'delete_todo' todo.pk %}" method="POST" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">削除</button>
                </form>
            </li>
        {% empty %}
            <li>タスクはありません。</li>
        {% endfor %}
    </ul>
</body>
</html>
